name: CI and VSIX release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: afterglow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: UTC

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13.1'
          cache: npm
      - name: Check source and release version
        run: node scripts/release-info.mjs
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - name: Package and inspect every registered theme
        run: npm run package:check

  build:
    name: Build release VSIX
    if: github.ref_type == 'tag'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      filename: ${{ steps.package.outputs.filename }}
      version: ${{ steps.package.outputs.version }}
      commit: ${{ steps.package.outputs.commit }}
      sha256: ${{ steps.package.outputs.sha256 }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13.1'
          cache: npm
      - run: npm ci
      - name: Build and verify the exact tagged source
        id: package
        run: npm run package:check
      - name: Transfer only the verified VSIX to the release job
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vsix-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: true

  release:
    name: Publish GitHub Release
    if: >-
      github.ref_type == 'tag' &&
      github.repository == 'koushik-stack/After-Glow-84-VSCODE-Extension-Package-' &&
      needs.validate.result == 'success' && needs.build.result == 'success'
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13.1'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: .release/publish
          merge-multiple: true
      - name: Verify checksum and publish exactly one release asset
        run: node scripts/publish-release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_FILENAME: ${{ needs.build.outputs.filename }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          RELEASE_SHA256: ${{ needs.build.outputs.sha256 }}
